<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="estils.css">
  <title>Carrusel CSS Pur</title>
</head>
<body>
  <div class="container">
    <h1>Carrusel d'Imatges</h1>

    <div class="carousel">
      <!-- Diapositives -->
      <div class="slides">
        <div class="slide">
          <div>Primera Diapositiva 🎨</div>
        </div>
        <div class="slide">
          <div>Segona Diapositiva 🚀</div>
        </div>
        <div class="slide">
          <div>Tercera Diapositiva 🌟</div>
        </div>
        <div class="slide">
          <div>Quarta Diapositiva ✨</div>
        </div>
      </div>

      <!-- Fletxes "anterior" (una per a cada diapositiva, excepte la primera) -->
      <label for="slide1" class="navArrow prev arrowPrev2">‹</label>
      <label for="slide2" class="navArrow prev arrowPrev3">‹</label>
      <label for="slide3" class="navArrow prev arrowPrev4">‹</label>

      <!-- Fletxes "següent" (una per a cada diapositiva, excepte l'última) -->
      <label for="slide2" class="navArrow next arrowNext1">›</label>
      <label for="slide3" class="navArrow next arrowNext2">›</label>
      <label for="slide4" class="navArrow next arrowNext3">›</label>

      <!-- Punts de navegació: cada punt és un <label> que conté el seu radio.
           Tots els radio tenen el mateix "name": només un pot estar marcat. -->
      <div class="dots">
        <label class="dot"><input type="radio" name="slide" id="slide1" checked></label>
        <label class="dot"><input type="radio" name="slide" id="slide2"></label>
        <label class="dot"><input type="radio" name="slide" id="slide3"></label>
        <label class="dot"><input type="radio" name="slide" id="slide4"></label>
      </div>
    </div>
  </div>
</body>
</html>
