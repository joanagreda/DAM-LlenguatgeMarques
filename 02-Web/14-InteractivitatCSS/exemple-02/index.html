<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="estils.css">
  <title>Dos toggles</title>
</head>
<body>
  <!-- Toggle 1: el checkbox és dins del <label>, per això no cal "for" -->
  <label class="toggle">
    <input type="checkbox" id="wifi">
    <span class="indicator"></span>
    <span>Wi-Fi</span>
  </label>

  <!-- Toggle 2 -->
  <label class="toggle">
    <input type="checkbox" id="bluetooth" checked>
    <span class="indicator"></span>
    <span>Bluetooth</span>
  </label>
</body>
</html>
