<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Canviar el color d'una capsa amb dos botons</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
    }

    /* Amaguem els radio: només es veuen els <label>, que fan de botó */
    input[type="radio"] {
      display: none;
    }

    /* Els <label> actuen com a botons visuals */
    label {
      background: linear-gradient(to bottom, #ddd, #aaa); /* gris metàl·lic */
      border: 1px solid #666;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      color: #222;
      cursor: pointer;
      display: inline-block;
      font-size: 14px;
      font-weight: 500;
      margin: 5px;
      padding: 8px 18px;
      transition: all 0.2s ease-in-out;
      user-select: none;
    }

    label:hover {
      background: linear-gradient(to bottom, #ccc, #999);
    }

    /* El <label> que conté el radio marcat es pinta de blau.
       Una sola regla serveix per a tots els botons! */
    label:has(:checked) {
      background: linear-gradient(to bottom, #3d7bff, #0053d6);
      border-color: #0044bb;
      box-shadow: 0 0 6px rgba(0, 98, 255, 0.7);
      color: white;
    }

    /* Estil base de la capsa */
    .box {
      background-color: #d0d0d0;
      border-radius: 10px;
      height: 100px;
      margin: 15px 5px;
      transition: 0.3s;
      width: 100px;
    }

    /* Si a la pàgina hi ha el radio #verd marcat, la capsa es posa verda */
    body:has(#verd:checked) .box {
      background-color: #3ad13a;
      transform: rotate(-5deg);
    }

    /* Si a la pàgina hi ha el radio #vermell marcat, la capsa es posa vermella */
    body:has(#vermell:checked) .box {
      background-color: #ff3b30;
      transform: rotate(5deg);
    }
  </style>
</head>
<body>
  <!-- Els radio són DINS del <label>: clicar el text marca el radio (no cal "for").
       Tenen el mateix "name", així només un pot estar marcat alhora. -->
  <label><input type="radio" name="color" id="verd"> Color verd</label>
  <label><input type="radio" name="color" id="vermell" checked> Color vermell</label>

  <!-- Element que canvia segons quin radio està marcat -->
  <div class="box"></div>
</body>
</html>
