<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Checkbox i CSS</title>
  <style>
    body {
      background-color: white;
    }

    /* Si el <body> conté l'input #verd marcat, el fons es posa verd */
    body:has(#verd:checked) {
      background-color: lightgreen;
    }
  </style>
</head>
<body>
  <input type="checkbox" id="verd">
  <label for="verd">Fons verd</label>
</body>
</html>
